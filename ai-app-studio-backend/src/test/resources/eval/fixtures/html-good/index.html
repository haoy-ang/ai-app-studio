<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>像素咖啡 · 城市里的第三空间</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, "PingFang SC", sans-serif;
            color: #1f2933;
            background: #faf8f5;
            line-height: 1.7;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 48px;
            border-bottom: 1px solid #e8e2d9;
        }
        nav a { margin-left: 28px; color: #52606d; text-decoration: none; }
        nav a:hover { color: #b45309; }
        .hero { padding: 96px 48px; max-width: 880px; }
        .hero h1 { font-size: 48px; line-height: 1.2; margin-bottom: 24px; }
        .hero p { font-size: 18px; color: #52606d; margin-bottom: 32px; }
        .cta {
            display: inline-block;
            padding: 14px 32px;
            background: #b45309;
            color: #fff;
            border-radius: 8px;
            text-decoration: none;
        }
        footer { padding: 32px 48px; color: #7b8794; border-top: 1px solid #e8e2d9; }
    </style>
</head>
<body>
<header>
    <strong>像素咖啡</strong>
    <nav>
        <a href="#menu">菜单</a>
        <a href="#story">品牌故事</a>
        <a href="#visit">门店地址</a>
    </nav>
</header>

<main>
    <section class="hero">
        <h1>城市里的第三空间，<br>从一杯手冲开始</h1>
        <p>我们只做三件事：挑豆子、控水温、把杯子洗干净。剩下的时间留给你和你的朋友。</p>
        <a class="cta" href="#menu">看看今天喝什么</a>
    </section>

    <section id="menu">
        <h2>本周菜单</h2>
        <ul>
            <li>耶加雪菲 · 水洗 · 浅烘 —— 柑橘与茉莉，酸质明亮</li>
            <li>哥伦比亚 · 厌氧日晒 —— 草莓酱与朗姆酒尾韵</li>
            <li>云南保山 · 蜜处理 —— 红糖与坚果，口感圆润</li>
        </ul>
    </section>
</main>

<footer>
    <p>像素咖啡 · 每天 08:00 – 21:00 · 支持自带杯减免 3 元</p>
</footer>
</body>
</html>
