# ============================================================
# Docker Compose 专用配置（容器里用 SPRING_PROFILES_ACTIVE=docker 激活）
#
# 和 application-local.yml 的分工：
#   - local   ：本机开发，MySQL/Redis 都在 127.0.0.1，密钥写在被 gitignore 的文件里
#   - docker  ：容器里跑，MySQL/Redis 走 compose 的服务名，密钥全部从环境变量注入
# 所有 `${VAR:default}` 都给了默认值，保证「不填也能起来」，
# 但真正要用 AI 生成，DEEPSEEK_API_KEY 必须填。
# ============================================================

spring:
  datasource:
    url: jdbc:mysql://mysql:3306/ai_app_studio?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=utf8
    username: root
    password: ${MYSQL_ROOT_PASSWORD:123456}
  data:
    redis:
      host: redis
      port: 6379
      password: ${REDIS_PASSWORD:}

# ==================== 对象存储 ====================
# 只在「上传头像 / 生成封面」时才会真的外呼；Bean 在启动时就要 new，
# 所以 region 必须给一个合法值（这里默认上海），密钥留空不影响启动。
cos:
  client:
    host: ${COS_HOST:https://demo-0000000000.cos.ap-shanghai.myqcloud.com}
    secretId: ${COS_SECRET_ID:}
    secretKey: ${COS_SECRET_KEY:}
    region: ${COS_REGION:ap-shanghai}
    bucket: ${COS_BUCKET:demo-0000000000}

# ==================== AI 模型 ====================
# 三个入口共用一把 DeepSeek key；routing 留空会自动降级到 DeepSeek（见 AiCodeGenTypeRoutingServiceFactory）。
langchain4j:
  open-ai:
    chat-model:
      api-key: ${DEEPSEEK_API_KEY:sk-docker-placeholder}
      base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
      model-name: ${DEEPSEEK_MODEL:deepseek-chat}
    streaming-chat-model:
      api-key: ${DEEPSEEK_API_KEY:sk-docker-placeholder}
      base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
      model-name: ${DEEPSEEK_MODEL:deepseek-chat}
    routing-chat-model:
      api-key: ${ROUTING_API_KEY:}
      base-url: ${ROUTING_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
      model-name: ${ROUTING_MODEL:qwen-turbo}

# ==================== 产物目录 ====================
# 容器内固定到 /data，由 compose 挂卷到宿主机 ./data，重建容器不丢产物。
app:
  deploy:
    root-dir: ${APP_DEPLOY_ROOT_DIR:/data/deploy}
    # 部署访问地址是给「浏览器」看的，所以默认宿主机 localhost；
    # 容器里截图访问它需要宿主机也起了 Nginx（见 README 的部署说明）。
    host: ${APP_DEPLOY_HOST:http://localhost:8080}
  version:
    enabled: ${APP_VERSION_ENABLED:true}
    root-dir: ${APP_VERSION_ROOT_DIR:/data/versions}

# 容器里默认开启限流（本机联调才关，见 application-local.example.yml 的说明）
ratelimit:
  enabled: ${RATELIMIT_ENABLED:true}
