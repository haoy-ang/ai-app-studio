spring:
  application:
    name: ai-app-studio
  profiles:
    active: local
  # session
  session:
    store-type: redis
    # session 过期时间 30 天过期
    timeout: 2592000
  # 文件上传大小限制。
  # ⚠️ Spring Boot 默认单文件只有 1MB，不显式放大会在上传头像时抛 MaxUploadSizeExceededException，
  # 而且会被 GlobalExceptionHandler 的 RuntimeException 分支吞成一句「系统错误」，用户完全看不懂。
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
  # redis
  data:
    redis:
      host: localhost
      port: 6379
      password:
      ttl: 3600
  # mysql
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/ai_app_studio?useSSL=false&serverTimezone=UTC
    username: root
    password: 123456
# ==================== AI 模型的公共行为 ====================
# ⚠️ Accept-Encoding: identity 不是优化项，是绕坑项（2026-10-18 实测）。
#
# 现象：所有「非流式」调用（智能路由、图片收集、代码质量检查）都抛
#   JsonEOFException: Unexpected end-of-input（源码里 body 就剩一个 "{"）。
# 排查（每层都单独写了探针验证，结论违反直觉）：
#   1. 同一请求 curl → 454 字节完整；裸 java.net.http.HttpClient → 完整；
#   2. langchain4j SpringRestClient → 1 字节；
#   3. 裸 Spring RestClient.builder().build() → 也是 1 字节（所以跟 langchain4j 无关）；
#   4. 裸 Apache HttpClient 5 → 454 字节完整（所以也不是 HC5 本身的锅）；
#   5. Spring RestClient + HC5 工厂 → 1 字节，加上 Accept-Encoding: identity → 454 字节。
# 结论：Spring 的 HttpComponents 工厂在解压这条 CDN 的
#   「vary: accept-encoding + Transfer-Encoding: chunked」响应时会截断。
#   HC5 是被 webdrivermanager 间接拖进 classpath 的，Spring 按 classpath 自动选中它。
#
# 修法选择：不去 pom 里排 httpclient5（那会让截图功能依赖的 webdrivermanager 缺类），
#   也不换 langchain4j 的客户端实现（其 SpringRestClient 构造时会无条件覆盖请求工厂，
#   换了也没用），而是让上游干脆别压缩 —— AI 的 JSON 响应本来就小，压缩省不了什么。
langchain4j:
  open-ai:
    chat-model:
      custom-headers:
        Accept-Encoding: identity
    streaming-chat-model:
      custom-headers:
        Accept-Encoding: identity

server:
  port: 8123
  servlet:
    context-path: /api
    # cookie 过期时间 30 天过期
    session:
      cookie:
        max-age: 2592000
#springdoc-openapi
springdoc:
  group-configs:
    - group: 'default'
      packages-to-scan: com.haoy.aiapp.controller
#knife4
knife4j:
  enable: true
  setting:
    language: zh_cn
# 部署配置
# ⚠️ app.deploy.root-dir 必须与 Nginx 配置里的 root 完全一致，否则访问部署地址会 404。
# 若用 user.dir + /tmp/code_deploy 这类跟随源码目录的路径，项目目录一改名
# 就会让 Nginx 的 root 失效 —— 这里固定成项目之外的绝对路径，两边同引用它就不再互相拖累。
app:
  deploy:
    # 部署产物根目录（可用环境变量 APP_DEPLOY_ROOT_DIR 覆盖）
    root-dir: ${APP_DEPLOY_ROOT_DIR:E:/ai-app-studio-data/deploy}
    # 部署访问地址前缀（本机 80 被 IIS/W3SVC 占用，Nginx 改监听 8080）
    host: ${APP_DEPLOY_HOST:http://localhost:8080}
  # 版本快照配置
  # 快照存的是「每次生成后的产物副本」，是用户资产，所以和部署目录一样固定到项目之外的绝对路径，
  # 不跟 user.dir 走（项目改名 / IDE 启动 / jar 启动的工作目录都不一样）。
  version:
    # 关掉之后生成不再打快照，历史版本仍可查询
    enabled: ${APP_VERSION_ENABLED:true}
    root-dir: ${APP_VERSION_ROOT_DIR:E:/ai-app-studio-data/versions}
    # 每个应用最多保留多少个版本（当前版本永不清理）
    max-keep: 10
    # 单个快照体积上限 32MB，超限跳过本次快照（Vue 的 node_modules/dist 已在存储层排除）
    max-size-bytes: 33554432

